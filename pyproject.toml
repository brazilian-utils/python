[tool.poetry]
name = "brutils"
version = "2.5.0"
description = "Utils library for specific Brazilian businesses"
authors = ["The Brazilian Utils Organization"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/brazilian-utils/python"
keywords = ["cpf", "cnpj", "cep", "document", "validation", "brazil", "brazilian"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Internationalization",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Natural Language :: English",
  "Natural Language :: Portuguese",
  "Natural Language :: Portuguese (Brazilian)"
]

[tool.poetry.dependencies]
python = "^3.10"
holidays = ">=0.58,<0.102"
num2words = "0.5.14"

[tool.poetry.group.dev.dependencies]
ruff = "0.15.17"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
pytest-randomly = "^4.1.0"

[tool.ruff]
line-length = 80
lint.extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest]
minversion = "9.1"
norecursedirs = [
  "*.egg",
  ".eggs",
  "dist",
  "build",
  ".git",
  "__pycache__",
]
addopts = [
  "--strict-markers",
  "--strict-config",
  "--doctest-modules",
  "--doctest-glob=README*.md",
  # pytest-cov
  "--cov=brutils",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=html",
  "--cov-report=xml",
  "--cov-branch",
]
testpaths = [
  "brutils",
  "tests",
  "README.md",
  "README_EN.md",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
